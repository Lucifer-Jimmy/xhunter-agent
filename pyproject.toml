[project]
name = "xhunter-agent"
version = "0.1.0"
description = "A modular, auditable security agent platform for authorized environments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
xhunter = "xhunter.application.cli.main:main"

[project.optional-dependencies]
full = [
    "pydantic>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xhunter"]
